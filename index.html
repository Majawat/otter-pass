<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Passphrase Generator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --code-bg: #0b1120;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2.5rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .controls-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .control-group label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    select, button {
      background: var(--code-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s ease;
      grid-column: 1 / -1;
      padding: 0.75rem;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .candidate-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .pass-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .pass-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .passphrase-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.15rem;
      color: #38bdf8;
      word-break: break-all;
      user-select: all;
    }

    .actions {
      display: flex;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .btn-action {
      cursor: pointer;
      padding: 0.35rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--code-bg);
    }

    .btn-action:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .copied {
      background: var(--success) !important;
      color: #000 !important;
      border-color: var(--success) !important;
    }

    .phonetic-drawer {
      display: none;
      background: var(--code-bg);
      border-radius: 6px;
      padding: 0.6rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
      border-left: 3px solid var(--accent);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Secure Admin Passphrases</h1>
    <p>Simple, phone-friendly words. Fast to type, high entropy.</p>
  </header>

  <div class="controls-card">
    <div class="control-group">
      <label for="wordCount">Words</label>
      <select id="wordCount">
        <option value="2">2 (Quick)</option>
        <option value="3" selected>3 (Standard Admin)</option>
        <option value="4">4 (High Security)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="separator">Separator</label>
      <select id="separator">
        <!-- Defaulted to None per your request -->
        <option value="" selected>None</option>
        <option value="-">Hyphen (-)</option>
        <option value="_">Underscore (_)</option>
        <option value=".">Period (.)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="caseStyle">Capitalization</label>
      <select id="caseStyle">
        <option value="title" selected>TitleCase</option>
        <option value="lower">lowercase</option>
        <option value="upper">UPPERCASE</option>
      </select>
    </div>

    <div class="control-group">
      <label for="suffixType">Suffix</label>
      <select id="suffixType">
        <option value="both" selected>Digit + Symbol</option>
        <option value="number">Digits Only</option>
        <option value="symbol">Symbol Only</option>
        <option value="none">None</option>
      </select>
    </div>

    <button class="btn-primary" id="btnRegenAll" onclick="generateAll()">Generate 4 New Passphrases</button>
  </div>

  <div class="candidate-list" id="candidateList"></div>
</div>

<script>
  // Simple, concrete, unmistakable words (elementary adjectives + physical nouns)
  // Stripped of high-register terms (discourse, fissure, juxtapose, etc.)
  const WORDLIST = [
    "acorn","amber","anchor","apple","apron","arrow","badger","baker","banana","banner",
    "bark","barrel","basket","beacon","bear","beaver","beetle","bell","berry","biscuit",
    "blanket","blazer","blimp","blizzard","block","blue","boat","bolt","bonnet","book",
    "boot","border","bottle","bounce","boxer","brave","breeze","brick","bridge","bright",
    "bubble","bucket","buckle","buffalo","buggy","builder","bullet","bullfrog","bumper","cabin",
    "cable","cactus","camel","camera","candle","canvas","canyon","cape","cargo","carpenter",
    "carrot","castle","cat","cedar","cellar","cement","chair","chalk","cheetah","cherry",
    "chest","chisel","circle","circus","clam","clay","cliff","clinic","clock","clover",
    "cloud","coach","coast","cobalt","cobra","coin","colt","comet","compass","cookie",
    "copper","coral","corner","cosmic","cotton","cousin","coyote","crab","crane","crater",
    "creek","cricket","crow","cruiser","crystal","cube","cupboard","curtain","cushion","daisy",
    "dancer","dandelion","dart","dealer","delta","denim","dentist","depot","desert","diamond",
    "dipper","diver","doctor","dodge","dollar","dolphin","donkey","door","dragon","drawer",
    "drill","driver","drum","duckling","dune","eagle","earth","echo","eclipse","elbow",
    "elder","elk","engine","eraser","falcon","farmer","fawn","feather","fence","fern",
    "ferret","fiddle","field","finch","finger","firefly","flame","flamingo","flannel","flash",
    "flock","flower","flute","flying","forest","fountain","fox","frog","frost","frozen",
    "funnel","furnace","galaxy","garden","garlic","gasoline","gate","gem","geyser","giant",
    "giraffe","glacier","glass","globe","glove","gold","goose","gorilla","grain","granite",
    "grape","grass","gravel","green","griddle","guitar","gull","hammer","hammock","hamster",
    "harbor","hare","harp","hatchet","hawk","haystack","hazel","helmet","heron","hickory",
    "hippo","hollow","honey","hook","hornet","horse","hose","hound","humming","hunter",
    "iceberg","icicle","igloo","island","jacket","jaguar","jasmine","jaw","jaybird","jeep",
    "jelly","jewel","jockey","jumper","jungle","jupiter","kangaroo","kayak","kelp","kettle",
    "king","kite","kitten","kiwi","ladder","ladybug","lagoon","lake","lamp","lantern",
    "lapel","lark","laser","latch","laurel","lava","lawn","leader","leaf","lemon",
    "leopard","lettuce","lever","light","lightning","lily","lime","lion","lizard","llama",
    "lobster","lock","locust","lodge","loon","lotus","lumber","lunar","magpie","mailbox",
    "mango","maple","marble","marsh","mast","meadow","melon","meteor","mill","mimic",
    "mint","mirror","mitten","monkey","moon","moose","morning","moss","moth","motor",
    "mountain","mouse","mule","mussel","mustard","needle","nest","nickel","night","ninja",
    "noodle","north","notebook","nozzle","oak","oar","oasis","ocean","octopus","olive",
    "onyx","opal","orbit","orchid","ostrich","otter","owl","paddle","palace","palm",
    "panda","panther","paper","parcel","parrot","pasture","path","peach","peacock","peanut",
    "pear","pearl","pebble","pelican","pencil","penguin","pepper","perch","petal","pheasant",
    "picnic","pigeon","pilot","pine","pinnacle","pipe","pirate","pistol","planet","plaza",
    "plum","pocket","polar","pony","poodle","poplar","porch","portal","postage","potter",
    "prairie","prince","prism","puddle","puffin","pulley","puma","pumpkin","puppy","pyramid",
    "quail","quartz","queen","quiver","rabbit","radar","raft","rail","rainbow","rambler",
    "ranger","raven","record","redwood","reef","ribbon","ridge","river","road","robin",
    "robot","rock","rocket","rooster","rope","rowboat","ruby","runner","saddle","sailor",
    "salmon","sand","sapphire","saturn","sawdust","scanner","scarf","schooner","scooter","scout",
    "seagull","seal","shadow","shell","shield","ship","shovel","shrimp","silver","skater",
    "skipper","skunk","skylight","slate","sled","sleeve","slipper","snail","snake","snow",
    "solar","sparrow","spider","sponge","spool","spoon","spring","spruce","squirrel","stable",
    "star","station","steam","stone","stork","storm","stream","stripe","submarine","summer",
    "sunflower","sunrise","sunset","swan","sweater","swift","tadpole","tail","talon","tangerine",
    "teapot","temple","thunder","tiger","timber","toaster","tomato","torch","tornado","toucan",
    "tower","tracker","tractor","traffic","trail","train","trapeze","treasure","treat","tree",
    "triangle","trophy","truck","tulip","tuna","tunnel","turkey","turtle","umbrella","valley",
    "vapor","velvet","vessel","village","vine","viola","violet","volcano","voyage","waffle",
    "wagon","walnut","walrus","wand","wardrobe","wasp","water","wave","whale","wheat",
    "wheel","whistle","willow","wind","window","wing","winter","wizard","wolf","wombat",
    "woodpecker","wrench","yacht","yellow","zebra","zinnia"
  ];

  // Code-safe symbols: will not break SQL statements, XML payloads, or bash/cmd scripts
  const SAFE_SYMBOLS = ['!', '@', '#', '%', '_', '+', '='];

  const NATO_ALPHABET = {
    'a': 'Alpha', 'b': 'Bravo', 'c': 'Charlie', 'd': 'Delta', 'e': 'Echo',
    'f': 'Foxtrot', 'g': 'Golf', 'h': 'Hotel', 'i': 'India', 'j': 'Juliett',
    'k': 'Kilo', 'l': 'Lima', 'm': 'Mike', 'n': 'November', 'o': 'Oscar',
    'p': 'Papa', 'q': 'Quebec', 'r': 'Romeo', 's': 'Sierra', 't': 'Tango',
    'u': 'Uniform', 'v': 'Victor', 'w': 'Whiskey', 'x': 'X-ray', 'y': 'Yankee', 'z': 'Zulu',
    '0': 'Zero', '1': 'One', '2': 'Two', '3': 'Three', '4': 'Four',
    '5': 'Five', '6': 'Six', '7': 'Seven', '8': 'Eight', '9': 'Nine',
    '!': 'Exclamation', '@': 'At-Sign', '#': 'Hash', '%': 'Percent',
    '_': 'Underscore', '+': 'Plus', '=': 'Equals', '-': 'Dash', '.': 'Period'
  };

  function getCryptoInt(min, max) {
    const range = max - min;
    const array = new Uint32Array(1);
    window.crypto.getRandomValues(array);
    return min + (array[0] % range);
  }

  function formatWord(word, style) {
    if (style === 'title') {
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    } else if (style === 'upper') {
      return word.toUpperCase();
    }
    return word.toLowerCase();
  }

  function generateSinglePassphrase() {
    const count = parseInt(document.getElementById('wordCount').value, 10);
    const sep = document.getElementById('separator').value;
    const style = document.getElementById('caseStyle').value;
    const suffixMode = document.getElementById('suffixType').value;

    const words = [];
    for (let i = 0; i < count; i++) {
      const idx = getCryptoInt(0, WORDLIST.length);
      words.push(formatWord(WORDLIST[idx], style));
    }

    let core = words.join(sep);
    let suffix = '';

    if (suffixMode === 'both') {
      suffix = getCryptoInt(10, 100) + SAFE_SYMBOLS[getCryptoInt(0, SAFE_SYMBOLS.length)];
    } else if (suffixMode === 'number') {
      suffix = getCryptoInt(10, 100);
    } else if (suffixMode === 'symbol') {
      suffix = SAFE_SYMBOLS[getCryptoInt(0, SAFE_SYMBOLS.length)];
    }

    return core + suffix;
  }

  function getPhoneticSpelling(text) {
    return text.split('').map(char => {
      const lower = char.toLowerCase();
      if (NATO_ALPHABET[lower]) {
        const isUpper = (char !== lower && /[a-z]/i.test(char));
        return isUpper ? `[${NATO_ALPHABET[lower].toUpperCase()}]` : NATO_ALPHABET[lower];
      }
      return char;
    }).join(' • ');
  }

  function createPassCard(index) {
    const pass = generateSinglePassphrase();
    const card = document.createElement('div');
    card.className = 'pass-card';
    card.id = `card-${index}`;

    card.innerHTML = `
      <div class="pass-main">
        <span class="passphrase-text" id="text-${index}">${pass}</span>
        <div class="actions">
          <button class="btn-action" title="Show Phone Phonetics" onclick="toggleDrawer(${index})">📞 Spell</button>
          <button class="btn-action" title="Regenerate this one" onclick="regenOne(${index})">🔄</button>
          <button class="btn-action" title="Copy to Clipboard" onclick="copyPass(${index}, this)">Copy</button>
        </div>
      </div>
      <div class="phonetic-drawer" id="drawer-${index}">
        ${getPhoneticSpelling(pass)}
      </div>
    `;
    return card;
  }

  function generateAll() {
    const container = document.getElementById('candidateList');
    container.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      container.appendChild(createPassCard(i));
    }
  }

  function regenOne(index) {
    const textEl = document.getElementById(`text-${index}`);
    const drawerEl = document.getElementById(`drawer-${index}`);
    const newPass = generateSinglePassphrase();
    textEl.textContent = newPass;
    drawerEl.innerHTML = getPhoneticSpelling(newPass);
  }

  function toggleDrawer(index) {
    const drawer = document.getElementById(`drawer-${index}`);
    drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
  }

  function copyPass(index, btn) {
    const pass = document.getElementById(`text-${index}`).textContent;
    navigator.clipboard.writeText(pass).then(() => {
      const oldText = btn.textContent;
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = oldText;
        btn.classList.remove('copied');
      }, 1500);
    });
  }

  // Initial load
  generateAll();
</script>

</body>
</html>
